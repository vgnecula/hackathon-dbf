[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlint"
version = "0.1.0"
description = "A linter for agent-generated RL environments"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
daytona = ["daytona>=0.200"]
eval = ["braintrust>=0.30", "autoevals>=0.3", "openai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rlint = "rlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires a running Docker daemon",
    "daytona: requires DAYTONA_API_KEY and network access",
]
